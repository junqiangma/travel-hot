      const sourceLabels = {

        '酒旅情报局': '酒旅情报局',

      };
      const sourceBadgeColors = {
        'CARNOC': 'source-carnoc',
        'LOYALTYLOBBY': 'source-loyalty',
        'CEIC': 'source-ceic',
        '驻泰使馆': 'source-embassy',
        'CMB': 'source-cmb',
        'CITIC': 'source-citic',
        '酒旅情报局': 'source-xhs',
        'RAIL_12306': 'source-rail',
        'BOCOM': 'source-bocom'
      };

      const STORAGE_KEY = 'travel_dashboard_v2';

      const sourceGroups = {
        '信用卡': { label: '信用卡', sources: ['CMB', 'CITIC', 'BOCOM'] },
        '达人': { label: '达人', sources: ['酒旅情报局', '老鸭唐纳德', '嬉游小助理', '葱头的旅游羊毛', '一只酒店旅行兔'] }
      };
      const sourceToGroup = {
        'CMB': '信用卡',
        'CITIC': '信用卡',
        'BOCOM': '信用卡',
        '酒旅情报局': '达人',
        '老鸭唐纳德': '达人',
        '嬉游小助理': '达人',
        '葱头的旅游羊毛': '达人',
        '一只酒店旅行兔': '达人'
      };

      let currentPage = 1;
      let pageSize = 20;
      let activeGroupFilter = null;
      let activeSourceFilter = null;
      let allData = [];

      function escapeHtml(str) {
        if (!str) return '';
        return str.toString().replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      function loadData() {
        let stored = localStorage.getItem(STORAGE_KEY);
        let userData = [];
        if (stored) {
          try { userData = JSON.parse(stored); } catch(e) {}
          if (!Array.isArray(userData)) userData = [];
        }
        const seedIds = new Set(SEED_DATA.map(function(item){ return item.id; }));
        const filtered = userData.filter(function(item){
          return item && item.id && !seedIds.has(item.id);
        });
        const merged = SEED_DATA.concat(filtered);
        merged.sort(function(a, b){
          const ta = a.sortTime || '1970-01-01';
          const tb = b.sortTime || '1970-01-01';
          if (tb > ta) return 1;
          if (tb < ta) return -1;
          return 0;
        });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(merged));
        allData = merged;
        return merged;
      }

      function deleteItem(id) {
        if (!confirm('确定删除此条目？')) return;
        let stored = localStorage.getItem(STORAGE_KEY);
        if (!stored) return;
        let arr = [];
        try { arr = JSON.parse(stored); } catch(e) { return; }
        if (!Array.isArray(arr)) return;
        arr = arr.filter(function(item){ return item && item.id !== id; });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
        allData = arr;
        render();
      }

      function filterByGroup(group) {
        if (activeGroupFilter === group) {
          activeGroupFilter = null;
          activeSourceFilter = null;
        } else {
          activeGroupFilter = group;
          activeSourceFilter = null;
        }
        currentPage = 1;
        render();
      }

      function filterBySource(source) {
        const grp = sourceToGroup[source] || null;
        if (activeSourceFilter === source) {
          activeSourceFilter = null;
          if (grp && activeGroupFilter === grp) {
            activeGroupFilter = null;
          }
        } else {
          activeSourceFilter = source;
          if (grp) {
            activeGroupFilter = grp;
          } else {
            activeGroupFilter = null;
          }
        }
        currentPage = 1;
        render();
      }

      function render() {
        const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
        let filtered = allData;
        if (activeSourceFilter) {
          filtered = filtered.filter(function(item){
            return item.source === activeSourceFilter;
          });
        } else if (activeGroupFilter) {
          const groupSources = sourceGroups[activeGroupFilter].sources;
          filtered = filtered.filter(function(item){
            return groupSources.indexOf(item.source) !== -1;
          });
        }
        if (keyword) {
          filtered = filtered.filter(function(item){
            const text = (item.title || '') + ' ' + (item.originalTitle || '') + ' ' + (item.category || '') + ' ' + (item.location || '') + ' ' + (item.content || '') + ' ' + (item.keywords || []).join(' ');
            return text.toLowerCase().indexOf(keyword) !== -1;
          });
        }

        const total = filtered.length;
        const totalPages = Math.max(1, Math.ceil(total / pageSize));
        if (currentPage > totalPages) currentPage = totalPages;
        const start = (currentPage - 1) * pageSize;
        const end = start + pageSize;
        const pageItems = filtered.slice(start, end);

        const counts = {};
        allData.forEach(function(item){
          const s = item.source || 'UNKNOWN';
          counts[s] = (counts[s] || 0) + 1;
        });

        // Build top-level stat cards
        let statsHtml = '';
        statsHtml += '<div class="stat-card stat-plain"><b>' + total + '</b>当前显示</div>';
        statsHtml += '<div class="stat-card stat-plain"><b>' + allData.length + '</b>总条目</div>';

        // All button
        const allActive = (activeGroupFilter === null && activeSourceFilter === null);
        statsHtml += '<div class="stat-card' + (allActive ? ' active' : '') + '" onclick="filterBySource(null)"><b>' + allData.length + '</b>全部</div>';

        // Independent sources (not in any group)
        const groupSourcesSet = new Set();
        Object.keys(sourceGroups).forEach(function(g) {
          sourceGroups[g].sources.forEach(function(s) { groupSourcesSet.add(s); });
        });

        Object.keys(counts).forEach(function(src){
          if (groupSourcesSet.has(src)) return;
          const label = sourceLabels[src] || src;
          const isActive = (activeSourceFilter === src && activeGroupFilter === null);
          statsHtml += '<div class="stat-card' + (isActive ? ' active' : '') + '" onclick="filterBySource(' + "'" + escapeHtml(src) + "'" + ')"><b>' + counts[src] + '</b>' + escapeHtml(label) + '</div>';
        });

        // Group-level cards
        Object.keys(sourceGroups).forEach(function(grp){
          const grpDef = sourceGroups[grp];
          let grpCount = 0;
          grpDef.sources.forEach(function(s){ grpCount += (counts[s] || 0); });
          const isGrpActive = (activeGroupFilter === grp && activeSourceFilter === null);
          statsHtml += '<div class="stat-card' + (isGrpActive ? ' active' : '') + '" onclick="filterByGroup(' + "'" + escapeHtml(grp) + "'" + ')"><b>' + grpCount + '</b>' + escapeHtml(grpDef.label) + '</div>';
        });

        document.getElementById('stats').innerHTML = statsHtml;

        // Sub-group row (if a group is selected)
        if (activeGroupFilter && sourceGroups[activeGroupFilter]) {
          let subHtml = '<div style="margin-top:8px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;">';
          subHtml += '<span style="font-size:12px;color:#888;padding-left:4px;">' + escapeHtml(sourceGroups[activeGroupFilter].label) + '：</span>';

          // "All within group" button
          const allInGroupActive = (activeGroupFilter && activeSourceFilter === null);
          let grpTotal = 0;
          sourceGroups[activeGroupFilter].sources.forEach(function(s){ grpTotal += (counts[s] || 0); });
          subHtml += '<div class="stat-card sub-stat' + (allInGroupActive ? ' active' : '') + '" onclick="filterByGroup(' + "'" + escapeHtml(activeGroupFilter) + "'" + ')"><b>' + grpTotal + '</b>全部' + escapeHtml(sourceGroups[activeGroupFilter].label) + '</div>';

          sourceGroups[activeGroupFilter].sources.forEach(function(src){
            const label = sourceLabels[src] || src;
            const isActive = (activeSourceFilter === src);
            subHtml += '<div class="stat-card sub-stat' + (isActive ? ' active' : '') + '" onclick="filterBySource(' + "'" + escapeHtml(src) + "'" + ')"><b>' + (counts[src] || 0) + '</b>' + escapeHtml(label) + '</div>';
          });

          subHtml += '</div>';
          document.getElementById('stats').innerHTML = statsHtml + subHtml;
        }

        let tbody = '';
        if (pageItems.length === 0) {
          tbody = '<tr><td colspan="5" class="empty">暂无数据</td></tr>';
        } else {
          pageItems.forEach(function(item) {
            let sourceClass = sourceBadgeColors[item.source] || 'source-carnoc';

            let typeClass = 'badge-carnoc';
            if (item.source === 'CEIC') {
              if (item.type === '国内 \u22655级') typeClass = 'badge-eq-domestic';
              else typeClass = 'badge-eq-intl';
            } else if (item.source === 'LOYALTYLOBBY') {
              typeClass = 'badge-loyalty';
            } else if (item.source === '驻泰使馆') {
              typeClass = 'badge-embassy';
            } else if (item.source === 'CMB') {
              typeClass = 'badge-cmb';
            } else if (item.source === 'CITIC') {
              typeClass = 'badge-citic';
            } else if (item.source === '酒旅情报局') {
              typeClass = 'badge-xhs';
            } else if (item.source === 'RAIL_12306') {
              typeClass = 'badge-rail';
            } else if (item.source === '老鸭唐纳德') {
              typeClass = 'badge-xhs-laoya';
            } else if (item.source === '嬉游小助理') {
              typeClass = 'badge-xhs-xiyou';
              typeClass = 'badge-xhs-xiyou';
            } else if (item.source === '葱头的旅游羊毛') {
              typeClass = 'badge-xhs-congtou';
            } else if (item.source === '一只酒店旅行兔') {
              typeClass = 'badge-xhs-tuzi';
            } else if (item.source === 'BOCOM') {
              typeClass = 'badge-bocom';
            } else if (sourceBadgeColors[item.source]) {
              typeClass = 'badge-' + item.source.toLowerCase().replace(/[^a-z]/g, '');
            }

            let typeLabel = item.type || item.category || '其他';
            let sourceLabel = sourceLabels[item.source] || item.source || 'UNKNOWN';

            let titleHtml = '<div class="title-main">' + escapeHtml(item.title) + '</div>';
            if (item.source === 'LOYALTYLOBBY') {
              titleHtml += '<div class="title-sub">' + escapeHtml(item.originalTitle) + ' · ' + escapeHtml(item.author) + '</div>';
            } else if (item.source === 'CEIC') {
              titleHtml += '<div class="title-sub">' + escapeHtml(item.originalTitle) + '</div>';
            } else if (item.source === 'CARNOC') {
              titleHtml += '<div class="title-sub">' + escapeHtml(item.originalTitle) + '</div>';
            } else if (item.source === '驻泰使馆') {
              titleHtml += '<div class="title-sub">' + escapeHtml(item.originalTitle) + ' · ' + escapeHtml(item.author) + '</div>';
              if (item.content) {
                titleHtml += '<div class="content-preview">' + escapeHtml(item.content) + '</div>';
              }
            } else if (item.source === 'CMB') {
              titleHtml += '<div class="title-sub">' + escapeHtml(item.originalTitle) + ' · ' + escapeHtml(item.author) + '</div>';
            } else if (item.source === 'CITIC') {
              titleHtml += '<div class="title-sub">' + escapeHtml(item.originalTitle) + ' · ' + escapeHtml(item.author) + '</div>';
            } else if (item.source === '酒旅情报局') {
              titleHtml += '<div class="title-sub">' + escapeHtml(item.originalTitle) + ' · ' + escapeHtml(item.author) + ' · ' + escapeHtml(item.engagement ? item.engagement + ' ' : '') + '</div>';
            } else if (item.source === 'RAIL_12306') {
              titleHtml += '<div class="title-sub">' + escapeHtml(item.originalTitle) + ' · ' + escapeHtml(item.author) + '</div>';
            } else if (item.source === '酒旅情报局' || item.source === '老鸭唐纳德' || item.source === '嬉游小助理' || item.source === '葱头的旅游羊毛' || item.source === '一只酒店旅行兔') {
              titleHtml += '<div class="title-sub">' + escapeHtml(item.originalTitle) + ' · ' + escapeHtml(item.author) + ' · ' + escapeHtml(item.engagement ? item.engagement + ' ' : '') + '</div>';
            } else if (item.source === 'BOCOM') {
              titleHtml += '<div class="title-sub">' + escapeHtml(item.originalTitle) + ' · ' + escapeHtml(item.author) + '</div>';
            }

            let url = item.url || item.href || '';
            let viewBtn = '';
            if (url) {
              viewBtn = '<a class="btn btn-view" href="' + escapeHtml(url) + '" target="_blank">查看原文</a>';
            } else {
              viewBtn = '<a class="btn btn-view" href="#" onclick="return false;">查看原文</a>';
            }
            let delBtn = '<button class="btn btn-del" onclick="deleteItem(' + "'" + escapeHtml(item.id) + "'" + ')">删除</button>';

            tbody += '<tr>' +
              '<td class="title-cell">' + titleHtml + '</td>' +
              '<td><span class="source-badge ' + sourceClass + '">' + escapeHtml(sourceLabel) + '</span></td>' +
              '<td><span class="badge ' + typeClass + '">' + escapeHtml(typeLabel) + '</span></td>' +
              '<td class="time-cell">' + escapeHtml(item.displayTime || item.time || item.sortTime || '') + '</td>' +
              '<td class="actions">' + viewBtn + delBtn + '</td>' +
              '</tr>';
          });
        }
        document.getElementById('tableBody').innerHTML = tbody;

        let pageHtml = '<div class="page-size">每页 <select id="pageSizeSelect" onchange="changePageSize(this.value)"><option value="10"' + (pageSize === 10 ? ' selected' : '') + '>10</option><option value="20"' + (pageSize === 20 ? ' selected' : '') + '>20</option><option value="50"' + (pageSize === 50 ? ' selected' : '') + '>50</option></select> 条</div>';
        pageHtml += '<div class="page-info">第 ' + currentPage + ' / ' + totalPages + ' 页，共 ' + total + ' 条</div>';
        let btns = '<div class="page-btns">';
        btns += '<button class="page-btn" onclick="goPage(1)"' + (currentPage === 1 ? ' disabled' : '') + '>首页</button>';
        btns += '<button class="page-btn" onclick="goPage(' + (currentPage - 1) + ')"' + (currentPage === 1 ? ' disabled' : '') + '>上一页</button>';
        for (let i = 1; i <= totalPages; i++) {
          if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
            btns += '<button class="page-btn ' + (i === currentPage ? 'active' : '') + '" onclick="goPage(' + i + ')">' + i + '</button>';
          } else if (i === currentPage - 3 || i === currentPage + 3) {
            btns += '<span style="padding:6px 4px;color:#999;font-size:13px;">...</span>';
          }
        }
        btns += '<button class="page-btn" onclick="goPage(' + (currentPage + 1) + ')"' + (currentPage === totalPages ? ' disabled' : '') + '>下一页</button>';
        btns += '<button class="page-btn" onclick="goPage(' + totalPages + ')"' + (currentPage === totalPages ? ' disabled' : '') + '>末页</button>';
        btns += '</div>';
        pageHtml += btns;
        document.getElementById('pagination').innerHTML = pageHtml;
      }

      function goPage(p) {
        currentPage = p;
        render();
      }

      function changePageSize(val) {
        pageSize = parseInt(val, 10);
        currentPage = 1;
        render();
      }

      window.goPage = goPage;
      window.changePageSize = changePageSize;
      window.deleteItem = deleteItem;
      window.filterBySource = filterBySource;
      window.filterByGroup = filterByGroup;
      window.render = render;

      loadData();
      render();
    })();
  </script>
</body>
</html>
