name: update-data

# 云端兜底更新：每天 09:47（Asia/Shanghai）= 01:47 UTC
# 只抓取可直连的数据源（CARNOC / LoyaltyLobby / USGS / 12306），
# 本地 Kimi 定时任务（每天 08:12）负责全量更新与翻译，两者按 id 去重互补。
on:
  schedule:
    - cron: '47 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests beautifulsoup4

      - name: Run updater
        run: python scripts/update.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js
          if git diff --cached --quiet; then
            echo "no data change, skip commit"
          else
            git commit -m "chore: cloud data update $(date -u +%F)"
            git pull --rebase origin main || true
            git push origin main
          fi
